<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>프로젝트 소개</title>
  <meta name="description" content="프로젝트 소개 링크 페이지" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1115;
      --bg-glow-1: rgba(99, 102, 241, 0.35);
      --bg-glow-2: rgba(236, 72, 153, 0.25);
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f6f8;
      --muted: #a0a6b3;
      --accent: #8b8cf8;
    }
    :root[data-theme="light"] {
      --bg: #f6f7fb;
      --bg-glow-1: rgba(99, 102, 241, 0.18);
      --bg-glow-2: rgba(236, 72, 153, 0.14);
      --card: #ffffff;
      --card-hover: #f0f1f7;
      --border: rgba(15, 17, 21, 0.1);
      --text: #14161c;
      --muted: #5f6675;
      --accent: #5b5ce6;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f6f7fb;
        --bg-glow-1: rgba(99, 102, 241, 0.18);
        --bg-glow-2: rgba(236, 72, 153, 0.14);
        --card: #ffffff;
        --card-hover: #f0f1f7;
        --border: rgba(15, 17, 21, 0.1);
        --text: #14161c;
        --muted: #5f6675;
        --accent: #5b5ce6;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      position: relative;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }
    body::before { background: var(--bg-glow-1); top: -30vmax; left: -20vmax; }
    body::after  { background: var(--bg-glow-2); bottom: -30vmax; right: -20vmax; }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    header { text-align: center; }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      font-size: 36px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .link:hover, .link:focus-visible {
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      outline: none;
    }
    .link:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
    .link:active { transform: translateY(0); }

    .icon {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: rgba(139, 140, 248, 0.15);
    }
    .text { flex: 1; min-width: 0; }
    .title {
      display: block;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }
    .desc {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .arrow {
      flex: none;
      color: var(--muted);
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .link:hover .arrow { transform: translateX(3px); color: var(--accent); }

    footer {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">🚀</div>
      <h1>프로젝트 소개</h1>
    </header>

    <nav aria-label="프로젝트 링크">
      <a class="link" href="news-reading-helper.html">
        <span class="icon" aria-hidden="true">📰</span>
        <span class="text">
          <span class="title">뉴스 보고서 PDF 생성 Skill</span>
          <span class="desc">뉴스 기사 URL 하나로 1~2쪽 리서치 노트 PDF를 만드는 스킬</span>
        </span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

      <a class="link" href="https://dongguk.the-prompt.me/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">🎓</span>
        <span class="text">
          <span class="title">동국대 챗봇 에이전트</span>
          <span class="desc">동국대학교 정보를 안내하는 대화형 에이전트 페이지</span>
        </span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

      <a class="link" href="hr-plugin.html">
        <span class="icon" aria-hidden="true">📊</span>
        <span class="text">
          <span class="title">HR 리스크 분석 및 예측 대시보드 플러그인</span>
          <span class="desc">HR 엑셀로 퇴사 위험을 예측하고 대시보드로 보여 주는 플러그인</span>
        </span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </nav>

    <footer>© 2026</footer>
  </main>
</body>
</html>
